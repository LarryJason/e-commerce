name: ecommerce

services:
  db:
    image: postgres:17-alpine
    env_file: .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5432 est pris par le PostgreSQL de la machine, 5433 par la base de dev (docker-compose.yml)
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    image: ecommerce-tools
    env_file: .env.docker
    command: npm run db:migrate
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    image: ecommerce-app
    env_file: .env.docker
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata: